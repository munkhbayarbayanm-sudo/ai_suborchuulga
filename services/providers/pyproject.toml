[project]
name = "mongolsub-providers"
version = "0.2.0"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4", "pillow==11.2.1"]

[project.optional-dependencies]
asr = ["whisperx==3.4.2", "faster-whisper==1.1.1", "ctranslate2==4.4.0", "torch==2.5.1", "torchaudio==2.5.1", "pyannote-audio==3.3.2", "transformers==4.48.3", "numpy==2.2.6", "onnxruntime==1.20.1", "silero-vad==5.1.2", "setuptools==75.8.0", "matplotlib==3.10.1"]
ocr = ["paddleocr==3.2.0", "paddlepaddle==3.2.0", "paddlex==3.2.1"]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = [".", "services/providers"]
testpaths = ["tests"]
